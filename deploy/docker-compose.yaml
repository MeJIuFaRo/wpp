# WEB PANEL PROXY 2.3.6 in Docker.
#
# All services share the network namespace of the `net` container, like a pod:
# they talk over 127.0.0.1 exactly as on a VPS (the WEB relay accepts only
# loopback peers). Only the ports below are published.
#
# Configuration and data live next to this file: ./config and ./data.
# First start: ./install.sh, then `docker compose up -d`.
name: wpp

x-service: &service
  restart: unless-stopped
  init: true
  network_mode: service:net
  depends_on:
    net:
      condition: service_started
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  ulimits:
    nofile: { soft: 1048576, hard: 1048576 }
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  net:
    image: mejiufaro/wpp-relay:${WPP_TAG:-2.3.6-2}
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "80:80/tcp"          # Caddy: HTTP-01 challenge and redirect to HTTPS
      - "443:443/tcp"        # Caddy: panel, WEB Proxy, VLESS XHTTP, subscriptions
      - "8443:8443/tcp"      # shared MTProto
      - "8443:8443/udp"      # Hysteria2
    sysctls:
      # Caddy runs unprivileged and binds 80/443.
      net.ipv4.ip_unprivileged_port_start: "0"
    extra_hosts:
      # The panel checks the published site at https://<domain>/ from inside.
      - "${WPP_DOMAIN:?set WPP_DOMAIN in .env}:127.0.0.1"
    logging:
      driver: json-file
      options: { max-size: 1m, max-file: "1" }

  panel:
    <<: *service
    image: mejiufaro/wpp-panel:${WPP_TAG:-2.3.6-2}
    environment:
      WPP_DOMAIN: ${WPP_DOMAIN}
      WPP_ACME_EMAIL: ${WPP_ACME_EMAIL:-}
      WPP_PUBLIC_HOST: ${WPP_PUBLIC_HOST:-}
      WPP_ADMIN_USER: ${WPP_ADMIN_USER:-admin}
      WPP_ADMIN_PASSWORD: ${WPP_ADMIN_PASSWORD:-}
      WPP_PANEL_PATH: ${WPP_PANEL_PATH:-}
    tmpfs:
      - /tmp
      - /run/lock
    volumes:
      - ./config/control:/var/lib/wpp-control
      - ./config/panel:/etc/web-proxy-panel
      - ./data/panel:/var/lib/tproxy-panel
      - ./config/units:/etc/systemd/system
      - ./config/relay:/etc/tproxy-server
      - ./config/mtproxy:/etc/mtproxy
      - ./config/xray:/etc/web-panel-proxy-xray
      - ./config/caddy:/etc/caddy
      - ./config/site:/srv/tproxy-site
      - ./data/caddy/caddy:/var/lib/caddy/.local/share/caddy:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket;socket.create_connection(('127.0.0.1',8090),3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  caddy:
    <<: *service
    image: ${WPP_CADDY_IMAGE:-caddy:2.11.4}
    user: "10000:10000"
    # admin is off in the Caddyfile; --watch applies the panel's changes.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    # The image's caddy binary has a file capability: it can be executed only
    # when the capability is in the bounding set.
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      net:
        condition: service_started
      panel:
        condition: service_healthy
    volumes:
      - ./config/caddy:/etc/caddy:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config

  relay:
    <<: *service
    image: mejiufaro/wpp-relay:${WPP_TAG:-2.3.6-2}
    volumes:
      - ./config/control:/var/lib/wpp-control
      - ./config/relay:/etc/tproxy-server:ro
      - ./config/site:/srv/tproxy-site:ro

  backends:
    <<: *service
    image: mejiufaro/wpp-mtproxy:${WPP_TAG:-2.3.6-2}
    environment:
      WPP_PUBLIC_IP: ${WPP_PUBLIC_IP:-}
    volumes:
      - ./config/control:/var/lib/wpp-control
      - ./config/units:/etc/systemd/system:ro
      - ./config/mtproxy:/etc/mtproxy:ro

  mtproto:
    <<: *service
    image: mejiufaro/wpp-mtproxy:${WPP_TAG:-2.3.6-2}
    environment:
      WPP_AGENT_NAME: mtproto
      WPP_AGENT_PORT: "9103"
      WPP_AGENT_UNITS: web-panel-proxy-mtproto.service
      WPP_PUBLIC_IP: ${WPP_PUBLIC_IP:-}
    volumes:
      - ./config/control:/var/lib/wpp-control
      - ./config/units:/etc/systemd/system:ro
      - ./config/mtproxy:/etc/mtproxy:ro

  xray:
    <<: *service
    image: mejiufaro/wpp-xray:${WPP_TAG:-2.3.6-2}
    volumes:
      - ./config/control:/var/lib/wpp-control
      - ./config/xray:/etc/web-panel-proxy-xray:ro
      - ./data/xray:/var/lib/web-panel-proxy-xray

  openflux:
    <<: *service
    image: mejiufaro/wpp-openflux:${WPP_TAG:-2.3.6-2}
    volumes:
      - ./config/control:/var/lib/wpp-control
      - ./config/units:/etc/systemd/system:ro
      - ./config/panel/openflux:/etc/web-proxy-panel/openflux:ro
      - ./data/openflux:/var/lib/wpp-openflux
